<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kappa Apparel Store - Official Links</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 25px 15px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            margin-top: 20px;
        }

        .brand-header {
            margin-bottom: 25px;
        }

        /* Foto Profil / Logo Kappa */
        .profile-img {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
            border: 2px solid #ffffff;
            background-color: #000;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        p.bio {
            font-size: 0.9rem;
            color: #b0b0b0;
            line-height: 1.4;
            padding: 0 10px;
        }

        .links-container {
            margin-top: 25px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 14px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease-in-out;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.15);
        }

        /* Tombol Utama Shopee */
        .btn-shopee {
            background-color: #ee4d2d;
            color: #ffffff;
        }

        /* Tombol TikTok Shop */
        .btn-tiktok {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #333333;
        }

        .btn-tiktok:hover {
            background-color: #1f1f1f;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #666;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <!-- Ganti src di bawah dengan link URL logo Kappa jika ada -->
            <img src="https://via.placeholder.com/100/000000/FFFFFF?text=KAPPA" alt="Kappa Apparel Logo" class="profile-img">
            <h1>Kappa Apparel Store</h1>
            <p class="bio">Official Store of Kappa Apparel Indonesia. Premium Sportswear & Casualwear.</p>
        </div>

        <div class="links-container">
            <!-- Link Affiliate Shopee -->
            <a href="https://s.shopee.co.id/BTO5BEv07" target="_blank" class="btn btn-shopee">
                🛒 Official Store di Shopee
            </a>

            <!-- Link TikTok Shop (Ganti USERNAME_TIKTOK dengan username akun TikTok Anda) -->
            <a href="https://www.tiktok.com/@USERNAME_TIKTOK" target="_blank" class="btn btn-tiktok">
                🎵 Official TikTok Shop
            </a>
        </div>

        <div class="footer">
            &copy; KAPPA APPAREL INDONESIA
        </div>
    </div>

</body>
</html>
