<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kappa Indonesia Store | Official Link</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --kappa-navy: #0A192F;
            --kappa-red: #E30613;
            --kappa-white: #FFFFFF;
            --bg-light: #F8F9FA;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--kappa-navy);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--kappa-white);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            padding: 40px 24px;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* Profile & Header */
        .profile-section {
            margin-bottom: 32px;
        }

        .logo-wrapper {
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: #fff;
            padding: 12px;
            box-shadow: var(--card-shadow);
            border: 2px solid #F0F0F0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .badge-official {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(227, 6, 19, 0.08);
            color: var(--kappa-red);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 50px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--kappa-navy);
            margin-bottom: 6px;
        }

        p.bio {
            font-size: 0.9rem;
            color: #64748B;
            line-height: 1.4;
        }

        /* Links Section */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--kappa-white);
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.15);
        }

        .link-card .icon-box {
            font-size: 1.4rem;
            width: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-card .text {
            flex-grow: 1;
            text-align: center;
            padding-right: 32px;
        }

        /* Platform Specific Colors */
        .shopee {
            background: linear-gradient(135deg, #FF5722 0%, #EE4D2D 100%);
        }

        .tiktok {
            background: linear-gradient(135deg, #111111 0%, #000000 100%);
            border: 1px solid #333;
        }

        /* Footer */
        .footer {
            margin-top: 36px;
            font-size: 0.8rem;
            color: #94A3B8;
        }

        .flag {
            width: 16px;
            height: 11px;
            vertical-align: middle;
            margin-left: 4px;
            box-shadow: 0 0 2px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-section">
            <div class="logo-wrapper">
                <svg viewBox="0 0 100 100" fill="#0A192F
